name: Lean

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: lake build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # A `sorry` only warns; reject it before building.
      - name: No sorry
        run: "! grep -rnwE 'sorry|admit' lean/HypergraphDualization"
      # Installs the toolchain pinned in lean/lean-toolchain, fetches the Mathlib
      # cache and runs `lake build`, which checks every proof in the library.
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          use-mathlib-cache: true
          build: true
