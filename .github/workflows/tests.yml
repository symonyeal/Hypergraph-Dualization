name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust ${{ matrix.crate }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [readonce_dag, frequency_constant]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --manifest-path experiments/${{ matrix.crate }}/Cargo.toml --check
      - run: cargo clippy --manifest-path experiments/${{ matrix.crate }}/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path experiments/${{ matrix.crate }}/Cargo.toml --release --locked

  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --manifest-path experiments/readonce_dag/Cargo.toml --release --locked
      - run: python -m pip install -e ".[dev]"
      - if: matrix.python-version == '3.14'
        run: python -m pytest
      - if: matrix.python-version == '3.10'
        run: python -m pytest -m "not slow"

  sage:
    name: SageMath 10.9
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Checkout runs on the host because the Sage image has neither a
      # compatible Actions Node runtime nor Git. Mount the checked-out tree and
      # keep installation and the backend checks in one container invocation.
      #
      # Sage container requirements:
      #
      # 1. Sage is not at /sage. The image installs it at /home/sage/sage and
      #    symlinks /usr/bin/sage, so it is simply `sage` on PATH. The old
      #    /sage/sage path made every run exit 127 before a single test ran.
      # 2. The image's default user is `sage` (uid 1000) while the runner owns
      #    the workspace as uid 1001, so an editable install and pytest's cache
      #    cannot write into the mount. Run as root; the container is --rm.
      # 3. Sage's Python is a virtualenv, which rejects `pip install --user`
      #    outright ("User site-packages are not visible in this virtualenv").
      #    As root the venv itself is writable, so install into it directly.
      - name: Test with SageMath 10.9
        run: |
          docker run --rm \
            --entrypoint /bin/bash \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work \
            -u root \
            ghcr.io/sagemath/sage-binder-env:10.9 \
            -lc 'sage --version &&
                 sage -python -m pip install -e ".[dev]" &&
                 sage -python -c "from fka.backends import has_sage; assert has_sage()" &&
                 sage -python -m pytest -m sage'
